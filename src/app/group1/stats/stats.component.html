<!DOCTYPE html>
<html>
	<head>
		<title>Statistics of Events and Categories</title>
	</head>

	<body>
		<style>
			h1 {text-align: center; font-size: 40px; background-color: #C1E1C1; padding: 30px; color: #1C3050}
			div {text-align: center;}
		</style>

		<div class="rounded">
			<h1>Statistics</h1>
		</div>

		<!-- Cards for Counters -->
		<div class="container my-4">
		    <div class="container">
                <div class="row justify-content-center text-center">
                    <div class="col-md-2 mb-5">
                        <div class="card mx-auto" style="width: 200px;">
                            <div class="card-body">
                                <h5 class="card-title">Events</h5>
                                <p class="card-text">{{numEvents}}</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-2 mb-5">
                        <div class="card mx-auto" style="width: 200px;">
                            <div class="card-body">
                                <h5 class="card-title">Category</h5>
                                <p class="card-text">{{numCategory}}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
		</div>
	</body>
</html>
